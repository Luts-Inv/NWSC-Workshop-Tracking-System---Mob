<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NWSC Pump Asset Management</title>

<!-- QR GENERATOR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    margin:0;
    padding:0;
}

body{

    border:0;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;

button.main:hover{

}

#qr-code{

<body>

<div class="container">

<h1>NWSC PUMP ASSET MANAGEMENT</h1>

     TABS

</button>

    class="tab"

<!-- =====================================================

<div id="registerSection">

<div class="form-group">

<label>Pump Manufacturer</label>

===================================================== -->

<div class="record-title">

Record ID:
<span id="qr-record-id"></span>

</div>


<div id="qr-code"></div>

QR contains ALL pump information

</div>


<button
    class="main secondary"
    onclick="window.print()">

    PRINT QR CODE

</button>


<button
    class="main secondary"
    onclick="resetForm()">

    REGISTER ANOTHER PUMP

</button>

</div>

</div>

     SCANNER SECTION
===================================================== -->

<div id="scan-section">

<div id="reader"></div>

    id="scan-result"
    class="result">

    class="main"

    SCAN ANOTHER PUMP

</button>

</div>

</div>


</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let scanner = null;

let scannerRunning = false;


/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "Luts-Inv";

const GITHUB_REPO =
    "NWSC-Workshop-Tracking-System";

const GITHUB_BRANCH = "main";

const PUMPS_FILE = "pumps.json";


const GITHUB_API =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PUMPS_FILE}`;


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener("load", function(){

    const today =
        new Date()
        .toISOString()
        .split("T")[0];

    document.getElementById(
        "entryDate"
    ).value = today;

    document.getElementById(
        "dateReceived"
    ).value = today;

});


/* =========================================================
   UNIQUE RECORD ID
========================================================= */

function generateRecordId(){

    const station =
        (
            document.getElementById(
                "station"
            ).value || "GEN"
        )
        .trim()
        .toUpperCase()
        .replace(
            /[^A-Z0-9]/g,
            ""
        )
        .substring(0,5) || "GEN";


    /*
       Timestamp makes every pump unique.
    */

    const timestamp =
        Date.now();


    return `NWSC-${station}-P-${timestamp}`;

}


/* =========================================================
   COLLECT FORM DATA
========================================================= */

function collectPumpData(){

    return {

        recordId:
            document.getElementById(
                "recordId"
            ).value.trim(),

        entryDate:
            document.getElementById(
                "entryDate"
            ).value,

        assetNumber:
            document.getElementById(
                "assetNumber"
            ).value.trim(),

        serialNumber:
            document.getElementById(
                "serialNumber"
            ).value.trim(),

        pumpManufacturer:
            document.getElementById(
                "pumpManufacturer"
            ).value.trim(),

        pumpModel:
            document.getElementById(
                "pumpModel"
            ).value.trim(),

        pumpType:
            document.getElementById(
                "pumpType"
            ).value,

        pumpCapacity:
            document.getElementById(
                "pumpCapacity"
            ).value,

        motorRating:
            document.getElementById(
                "motorRating"
            ).value,

        motorSerialNumber:
            document.getElementById(
                "motorSerialNumber"
            ).value.trim(),

        station:
            document.getElementById(
                "station"
            ).value.trim(),

        location:
            document.getElementById(
                "location"
            ).value.trim(),

        deliveredBy:
            document.getElementById(
                "deliveredBy"
            ).value.trim(),

        dateReceived:
            document.getElementById(
                "dateReceived"
            ).value,

        faultReported:
            document.getElementById(
                "faultReported"
            ).value.trim(),

        condition:
            document.getElementById(
                "condition"
            ).value

    };

}


/* =========================================================
   VALIDATION
========================================================= */

function validate(data){

    const required = [

        [
            "NWSC Asset Number",
            data.assetNumber
        ],

        [
            "Serial Number",
            data.serialNumber
        ],

        [
            "Pump Manufacturer",
            data.pumpManufacturer
        ],

        [
            "Pump Model",
            data.pumpModel
        ],

        [
            "Station",
            data.station
        ]

    ];


    const missing =
        required
        .filter(
            item => !item[1]
        )
        .map(
            item => item[0]
        );


    if(missing.length){

        alert(
            "Please complete the following:\n\n" +
            missing.join("\n")
        );

        return false;

    }


    return true;

}


/* =========================================================
   MAIN GENERATION FUNCTION
========================================================= */

async function generatePumpQR(){

    const button =
        document.getElementById(
            "generateButton"
        );

    const status =
        document.getElementById(
            "github-status"
        );


    try{

        /* Generate ID */

        const recordId =
            generateRecordId();


        document.getElementById(
            "recordId"
        ).value =
            recordId;


        /* Collect */

        const data =
            collectPumpData();


        /* Validate */

        if(!validate(data)){

            return;

        }


        /* Check QR library */

        if(
            typeof QRCode ===
            "undefined"
        ){

            throw new Error(
                "QR generator library did not load."
            );

        }


        button.disabled = true;

        button.textContent =
            "SAVING TO GITHUB...";


        status.textContent =
            "Saving pump record to GitHub...";

        status.style.color =
            "#1d4ed8";


        /* Save */

        const saved =
            await savePumpToGithub(
                data
            );


        if(!saved){

            throw new Error(
                "Pump was not saved."
            );

        }


        status.textContent =
            "✓ Pump saved to GitHub.";

        status.style.color =
            "#15803d";


        /* Generate QR */

        createPumpQR(data);


        button.textContent =
            "GENERATE PUMP QR CODE";


        button.disabled =
            false;


    }catch(error){

        console.error(
            "SYSTEM ERROR:",
            error
        );


        status.textContent =
            "ERROR: " +
            error.message;

        status.style.color =
            "#b91c1c";


        alert(
            "SYSTEM ERROR:\n\n" +
            error.message
        );


        button.disabled =
            false;


        button.textContent =
            "GENERATE PUMP QR CODE";

    }

}


/* =========================================================
   SAVE PUMP TO GITHUB
========================================================= */

async function savePumpToGithub(
    pumpData
){

    /*
       TESTING VERSION

       GitHub token is requested
       when saving.

       DO NOT publish a permanent
       token inside this HTML.
    */

    const token =
        prompt(
            "Enter your GitHub Personal Access Token:\n\n" +
            "Required to save this pump to pumps.json."
        );


    if(!token){

        throw new Error(
            "GitHub token was not provided."
        );

    }


    /* GET pumps.json */

    const getResponse =
        await fetch(
            `${GITHUB_API}?ref=${GITHUB_BRANCH}`,
            {

                method:"GET",

                headers:{

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        `Bearer ${token}`,

                    "X-GitHub-Api-Version":
                        "2022-11-28"

                }

            }
        );


    if(!getResponse.ok){

        const errorText =
            await getResponse.text();

        throw new Error(
            "Could not access pumps.json.\n\n" +
            errorText
        );

    }


    const fileData =
        await getResponse.json();


    /* Decode GitHub content */

    const binary =
        atob(
            fileData.content
            .replace(/\n/g,"")
        );


    const currentContent =
        decodeURIComponent(
            escape(binary)
        );


    /* Parse */

    let pumps;


    try{

        pumps =
            JSON.parse(
                currentContent
            );

    }catch(error){

        throw new Error(
            "pumps.json contains invalid JSON."
        );

    }


    if(
        !Array.isArray(pumps)
    ){

        throw new Error(
            "pumps.json must contain an array: []"
        );

    }


    /* Duplicate check */

    const duplicate =
        pumps.some(
            pump =>
                pump.recordId ===
                pumpData.recordId
        );


    if(duplicate){

        throw new Error(
            "Duplicate Record ID:\n" +
            pumpData.recordId
        );

    }


    /* Add pump */

    pumps.push(
        pumpData
    );


    /* Convert JSON */

    const jsonString =
        JSON.stringify(
            pumps,
            null,
            2
        );


    const encodedContent =
        btoa(
            unescape(
                encodeURIComponent(
                    jsonString
                )
            )
        );


    /* UPDATE GITHUB */

    const updateResponse =
        await fetch(
            GITHUB_API,
            {

                method:"PUT",

                headers:{

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        `Bearer ${token}`,

                    "Content-Type":
                        "application/json",

                    "X-GitHub-Api-Version":
                        "2022-11-28"

                },

                body:
                    JSON.stringify({

                        message:
                            `Add pump ${pumpData.recordId}`,

                        content:
                            encodedContent,

                        sha:
                            fileData.sha,

                        branch:
                            GITHUB_BRANCH

                    })

            }
        );


    if(
        !updateResponse.ok
    ){

        const errorData =
            await updateResponse.json();

        throw new Error(
            errorData.message ||
            "GitHub failed to save pump."
        );

    }


    return true;

}


/* =========================================================
   CREATE QR
========================================================= */

function createPumpQR(data){

    const qr =
        document.getElementById(
            "qr-code"
        );


    qr.innerHTML = "";


    /*
       FULL PUMP DATA IS STORED
       INSIDE THE QR.
    */

    const jsonData =
        JSON.stringify(
            data
        );


    /*
       Encode UTF-8 safely.
    */

    const encoded =
        btoa(
            unescape(
                encodeURIComponent(
                    jsonData
                )
            )
        );


    const payload =
        "NWSC_PUMP:" +
        encoded;


    try{

        new QRCode(
            qr,
            {

                text:payload,

                width:280,

                height:280,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H

            }
        );


        document.getElementById(
            "qr-record-id"
        ).textContent =
            data.recordId;


        document.getElementById(
            "qr-section"
        ).style.display =
            "block";


        document.getElementById(
            "qr-section"
        ).scrollIntoView({
            behavior:"smooth"
        });


    }catch(error){

        throw new Error(
            "QR generation failed: " +
            error.message
        );

    }

}


/* =========================================================
   REGISTER TAB
========================================================= */

function showRegister(){

    stopScanner();


    document.getElementById(
        "registerSection"
    ).style.display =
        "block";


    document.getElementById(
        "scan-section"
    ).style.display =
        "none";


    document.getElementById(
        "registerTab"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "scanTab"
    ).classList.remove(
        "active"
    );

}


/* =========================================================
   SCANNER TAB
========================================================= */

function showScanner(){

    document.getElementById(
        "registerSection"
    ).style.display =
        "none";


    document.getElementById(
        "scan-section"
    ).style.display =
        "block";


    document.getElementById(
        "registerTab"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "scanTab"
    ).classList.add(
        "active"
    );


    startScanner();

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner(){

    if(scannerRunning){

        return;

    }


    if(
        typeof Html5Qrcode ===
        "undefined"
    ){

        alert(
            "QR scanner library failed to load."
        );

        return;

    }


    document.getElementById(
        "scan-result"
    ).style.display =
        "none";


    document.getElementById(
        "reader"
    ).innerHTML =
        "";


    try{

        scanner =
            new Html5Qrcode(
                "reader"
            );


        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps:10,

                qrbox:{
                    width:250,
                    height:250
                }

            },

            onScanSuccess,

            function(){}

        );


        scannerRunning =
            true;


    }catch(error){

        console.error(
            "SCANNER ERROR:",
            error
        );


        alert(
            "Camera could not start.\n\n" +
            "Allow camera access and try again."
        );

    }

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner(){

    if(
        !scanner ||
        !scannerRunning
    ){

        return;

    }


    try{

        await scanner.stop();

        await scanner.clear();

    }catch(error){

        console.warn(
            error
        );

    }


    scannerRunning =
        false;

}


/* =========================================================
   QR SCAN SUCCESS
========================================================= */

async function onScanSuccess(
    decodedText
){

    await stopScanner();


    try{

        /*
           Verify NWSC QR.
        */

        if(
            !decodedText.startsWith(
                "NWSC_PUMP:"
            )
        ){

            throw new Error(
                "This is not a valid NWSC Pump QR code."
            );

        }


        /*
           Remove prefix.
        */

        const encodedData =
            decodedText.substring(
                "NWSC_PUMP:".length
            );


        /*
           Decode Base64.
        */

        const jsonText =
            decodeURIComponent(
                escape(
                    atob(
                        encodedData
                    )
                )
            );


        /*
           Convert JSON.
        */

        const record =
            JSON.parse(
                jsonText
            );


        /*
           Check Record ID.
        */

        if(
            !record.recordId
        ){

            throw new Error(
                "QR does not contain a Record ID."
            );

        }


        /*
           Display all information.
        */

        displayPump(
            record
        );


    }catch(error){

        console.error(
            "SCAN ERROR:",
            error
        );


        alert(
            "Could not read pump information:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   DISPLAY PUMP
========================================================= */

function displayPump(
    data
){

    const fields = [

        [
            "Record ID",
            data.recordId
        ],

        [
            "Entry Date",
            data.entryDate
        ],

        [
            "NWSC Asset Number",
            data.assetNumber
        ],

        [
            "Serial Number",
            data.serialNumber
        ],

        [
            "Pump Manufacturer",
            data.pumpManufacturer
        ],

        [
            "Pump Model",
            data.pumpModel
        ],

        [
            "Pump Type",
            data.pumpType
        ],

        [
            "Pump Capacity (m³/h)",
            data.pumpCapacity
        ],

        [
            "Motor Rating (kW)",
            data.motorRating
        ],

        [
            "Motor Serial Number",
            data.motorSerialNumber
        ],

        [
            "Station",
            data.station
        ],

        [
            "Location / Installation Point",
            data.location
        ],

        [
            "Delivered By",
            data.deliveredBy
        ],

        [
            "Date Received",
            data.dateReceived
        ],

        [
            "Fault Reported",
            data.faultReported
        ],

        [
            "Condition",
            data.condition
        ]

    ];


    const container =
        document.getElementById(
            "pump-details"
        );


    container.innerHTML =
        fields
        .map(
            ([label,value]) => `

                <div class="row">

                    <strong>
                        ${escapeHTML(label)}
                    </strong>

                    <span>
                        ${escapeHTML(
                            value || "—"
                        )}
                    </span>

                </div>

            `
        )
        .join("");


    document.getElementById(
        "scan-result"
    ).style.display =
        "block";


    document.getElementById(
        "scan-result"
    ).scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================================================
   SCAN AGAIN
========================================================= */

async function scanAgain(){

    document.getElementById(
        "scan-result"
    ).style.display =
        "none";


    await startScanner();

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

    const ids = [

        "recordId",
        "assetNumber",
        "serialNumber",
        "pumpManufacturer",
        "pumpModel",
        "pumpCapacity",
        "motorRating",
        "motorSerialNumber",
        "station",
        "location",
        "deliveredBy",
        "faultReported"

    ];


    ids.forEach(
        id => {

            document.getElementById(
                id
            ).value = "";

        }
    );


    const today =
        new Date()
        .toISOString()
        .split("T")[0];


    document.getElementById(
        "entryDate"
    ).value =
        today;


    document.getElementById(
        "dateReceived"
    ).value =
        today;


    document.getElementById(
        "pumpType"
    ).value =
        "Centrifugal";


    document.getElementById(
        "condition"
    ).value =
        "In Service";


    document.getElementById(
        "qr-code"
    ).innerHTML =
        "";


    document.getElementById(
        "qr-section"
    ).style.display =
        "none";


    document.getElementById(
        "github-status"
    ).textContent =
        "";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
