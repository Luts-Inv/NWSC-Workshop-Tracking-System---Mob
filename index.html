<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NWSC Pump Asset Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:12px;
    color:#1f2937
}

.container{
    max-width:760px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.12)
}

h1{
    text-align:center;
    color:#1d4ed8;
    font-size:22px;
    margin-bottom:20px;
    border-bottom:2px solid #e5e7eb;
    padding-bottom:15px
}

.tabs{
    display:flex;
    margin-bottom:20px;
    border-bottom:2px solid #e5e7eb
}

.tab{
    flex:1;
    padding:14px;
    border:0;
    background:white;
    font-weight:bold;
    cursor:pointer;
    color:#6b7280
}

.tab.active{
    color:#1d4ed8;
    border-bottom:3px solid #1d4ed8
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px
}

.form-group{
    display:flex;
    flex-direction:column
}

label{
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
    color:#374151
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:6px;
    font-size:14px;
    background:white
}

input:focus,select:focus{
    outline:none;
    border-color:#2563eb
}

.full{
    grid-column:span 2
}

button.main{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#1d4ed8;
    color:white;
    border:0;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px
}

button.main:hover{
    background:#1e40af
}

#qr-section{
    display:none;
    margin-top:20px;
    padding:20px;
    border:2px dashed #cbd5e1;
    border-radius:10px;
    text-align:center
}

#qr-code{
    display:flex;
    justify-content:center;
    margin:15px 0
}

#qr-code img{
    width:280px;
    height:280px
}

.record-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px
}

.status{
    margin-top:10px;
    font-weight:bold
}

.secondary{
    background:#6b7280!important
}

#scan-section{
    display:none
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto
}

.result{
    display:none;
    margin-top:20px;
    background:#eff6ff;
    padding:18px;
    border-radius:8px;
    border:1px solid #bfdbfe
}

.result h2{
    color:#1e3a8a;
    margin-bottom:15px;
    font-size:18px
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #dbeafe
}

.row strong{
    color:#6b7280;
    font-size:12px
}

.row span{
    text-align:right;
    font-weight:bold
}

@media(max-width:600px){
    .grid{
        grid-template-columns:1fr
    }

    .full{
        grid-column:span 1
    }

    .row{
        flex-direction:column;
        gap:3px
    }

    .row span{
        text-align:left
    }
}
</style>
</head>

<body>

<div class="container">

<h1>NWSC PUMP ASSET MANAGEMENT</h1>

<div class="tabs">
    <button id="registerTab" class="tab active" onclick="showRegister()">
        REGISTER PUMP
    </button>

    <button id="scanTab" class="tab" onclick="showScanner()">
        SCAN PUMP QR
    </button>
</div>


<!-- REGISTER -->

<div id="registerSection">

<div class="grid">

<div class="form-group">
<label>Record ID</label>
<input id="recordId" readonly>
</div>

<div class="form-group">
<label>Entry Date</label>
<input type="date" id="entryDate">
</div>

<div class="form-group">
<label>NWSC Asset Number</label>
<input id="assetNumber">
</div>

<div class="form-group">
<label>Serial Number</label>
<input id="serialNumber">
</div>

<div class="form-group">
<label>Pump Manufacturer</label>
<input id="pumpManufacturer">
</div>

<div class="form-group">
<label>Pump Model</label>
<input id="pumpModel">
</div>

<div class="form-group">
<label>Pump Type</label>
<select id="pumpType">
<option>Centrifugal</option>
<option>Submersible</option>
<option>Booster</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Pump Capacity (m³/h)</label>
<input type="number" id="pumpCapacity">
</div>

<div class="form-group">
<label>Motor Rating (kW)</label>
<input type="number" id="motorRating">
</div>

<div class="form-group">
<label>Motor Serial Number</label>
<input id="motorSerialNumber">
</div>

<div class="form-group">
<label>Station</label>
<input id="station">
</div>

<div class="form-group">
<label>Location / Installation Point</label>
<input id="location">
</div>

<div class="form-group">
<label>Delivered By</label>
<input id="deliveredBy">
</div>

<div class="form-group">
<label>Date Received</label>
<input type="date" id="dateReceived">
</div>

<div class="form-group">
<label>Fault Reported</label>
<input id="faultReported">
</div>

<div class="form-group">
<label>Condition</label>
<select id="condition">
<option>In Service</option>
<option>Out of Service</option>
<option>Under Maintenance</option>
<option>Under Repair</option>
<option>New</option>
</select>
</div>

</div>

<button class="main" onclick="generatePumpQR()">
GENERATE PUMP QR CODE
</button>


<div id="qr-section">

<div class="record-title">
Record ID: <span id="qr-record-id"></span>
</div>

<div id="qr-code"></div>

<div class="status">
QR contains ALL pump information
</div>

<button class="main secondary" onclick="window.print()">
PRINT QR CODE
</button>

<button class="main secondary" onclick="resetForm()">
REGISTER ANOTHER PUMP
</button>

</div>

</div>


<!-- SCANNER -->

<div id="scan-section">

<div id="reader"></div>

<div id="scan-result" class="result">

<h2>PUMP SPECIFICATIONS</h2>

<div id="pump-details"></div>

<button class="main" onclick="scanAgain()">
SCAN ANOTHER PUMP
</button>

</div>

</div>

</div>


<script>

let scanner = null;
let scannerRunning = false;

const GITHUB_OWNER = "Luts-Inv";
const GITHUB_REPO = "NWSC-Workshop-Tracking-System";
const GITHUB_BRANCH = "main";
const PUMPS_FILE = "pumps.json";

const GITHUB_API =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PUMPS_FILE}`;

const GITHUB_RAW =
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${PUMPS_FILE}`;


/* -------------------------
   UNIQUE RECORD ID
------------------------- */

function generateRecordId() {

    const station =
        (document.getElementById("station").value || "GEN")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .substring(0, 5) || "GEN";

    const timestamp = Date.now();

    return `NWSC-${station}-P-${timestamp}`;
}


/* -------------------------
   DEFAULT DATES
------------------------- */

window.onload=function(){

    const today =
        new Date().toISOString().split("T")[0];

    document.getElementById("entryDate").value=today;
    document.getElementById("dateReceived").value=today;

};


/* -------------------------
   COLLECT ALL DATA
------------------------- */
function collectPumpData() {

    const recordId =
        document.getElementById("recordId").value.trim();

    return {
        recordId: recordId,

        entryDate:
            document.getElementById("entryDate").value,

        assetNumber:
            document.getElementById("assetNumber").value.trim(),

        serialNumber:
            document.getElementById("serialNumber").value.trim(),

        pumpManufacturer:
            document.getElementById("pumpManufacturer").value.trim(),

        pumpModel:
            document.getElementById("pumpModel").value.trim(),

        pumpType:
            document.getElementById("pumpType").value,

        pumpCapacity:
            document.getElementById("pumpCapacity").value,

        motorRating:
            document.getElementById("motorRating").value,

        motorSerialNumber:
            document.getElementById("motorSerialNumber").value.trim(),

        station:
            document.getElementById("station").value.trim(),

        location:
            document.getElementById("location").value.trim(),

        deliveredBy:
            document.getElementById("deliveredBy").value.trim(),

        dateReceived:
            document.getElementById("dateReceived").value,

        faultReported:
            document.getElementById("faultReported").value.trim(),

        condition:
            document.getElementById("condition").value
    };
}


/* -------------------------
   VALIDATION
------------------------- */

function validate(data){

    const required=[
        ["NWSC Asset Number",data.assetNumber],
        ["Serial Number",data.serialNumber],
        ["Pump Manufacturer",data.pumpManufacturer],
        ["Pump Model",data.pumpModel],
        ["Station",data.station]
    ];

    const missing=
        required
        .filter(x=>!x[1])
        .map(x=>x[0]);

    if(missing.length){

        alert(
            "Please complete:\n\n"+
            missing.join("\n")
        );

        return false;
    }

    return true;
}


/* -------------------------
   CREATE QR
------------------------- */

function generatePumpQR() {

    // Generate a unique ID
    const recordId = generateRecordId();

    document.getElementById("recordId").value = recordId;

    // Collect all pump information
    const data = collectPumpData();

    // Validate
    if (!validate(data)) {
        return;
    }

    // Make sure QR library loaded
    if (typeof QRCode === "undefined") {
        alert(
            "QR generator library did not load.\n\n" +
            "Please check your internet connection and reload the page."
        );
        return;
    }

    // Convert ALL pump information into QR data
    const jsonData = JSON.stringify(data);

    const payload =
        "NWSC_PUMP:" +
        btoa(
            unescape(
                encodeURIComponent(jsonData)
            )
        );

    // Clear previous QR
    const qr = document.getElementById("qr-code");
    qr.innerHTML = "";

    try {

        new QRCode(qr, {
            text: payload,
            width: 280,
            height: 280,
            correctLevel: QRCode.CorrectLevel.H
        });

        // Display record ID
        document.getElementById("qr-record-id").textContent =
            recordId;

        // Show QR section
        document.getElementById("qr-section").style.display =
            "block";

        // Scroll to QR
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    } catch (error) {

        console.error("QR ERROR:", error);

        alert(
            "QR generation failed:\n\n" +
            error.message
        );
    }
}

function showQrCode(recordId) {
    const box = document.getElementById('qr-output-container');
    const qr = document.getElementById('qr-code');
    const title = document.getElementById('qr-title-label');
    const status = document.getElementById('cloud-status');

    qr.innerHTML = '';

    // Check whether QRCode.js loaded
    if (typeof QRCode === 'undefined') {
        status.textContent =
            'QR generator failed to load. Please check your internet connection and reload the page.';
        status.style.color = '#b91c1c';
        box.style.display = 'flex';
        return;
    }

    try {
        const payload = buildQrPayload(recordId);

        new QRCode(qr, {
            text: payload,
            width: 200,
            height: 200,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        title.textContent = 'Asset QR: ' + recordId;

        status.textContent = '✓ QR code generated successfully.';
        status.style.color = '#15803d';

        box.style.display = 'flex';

    } catch (error) {
        console.error('QR generation error:', error);

        status.textContent =
            'QR generation failed: ' + error.message;

        status.style.color = '#b91c1c';

        box.style.display = 'flex';
    }
}
/* -------------------------
   SWITCH TO REGISTER
------------------------- */

function showRegister(){

    stopScanner();

    document.getElementById(
        "registerSection"
    ).style.display="block";

    document.getElementById(
        "scan-section"
    ).style.display="none";

    document.getElementById(
        "registerTab"
    ).classList.add("active");

    document.getElementById(
        "scanTab"
    ).classList.remove("active");

}


/* -------------------------
   SWITCH TO SCANNER
------------------------- */

function showScanner(){

    document.getElementById(
        "registerSection"
    ).style.display="none";

    document.getElementById(
        "scan-section"
    ).style.display="block";

    document.getElementById(
        "registerTab"
    ).classList.remove("active");

    document.getElementById(
        "scanTab"
    ).classList.add("active");

    startScanner();

}


/* -------------------------
   START SCANNER
------------------------- */

async function startScanner(){

    if(scannerRunning) return;

    document.getElementById(
        "scan-result"
    ).style.display="none";


    scanner=new Html5Qrcode("reader");


    try{

        await scanner.start(

            {facingMode:"environment"},

            {
                fps:10,
                qrbox:{
                    width:250,
                    height:250
                }
            },

            qrSuccess,

            function(){}

        );

        scannerRunning=true;

    }catch(error){

        alert(
            "Camera could not start. "+
            "Please allow camera access."
        );

    }

}


/* -------------------------
   STOP SCANNER
------------------------- */

async function stopScanner(){

    if(!scanner || !scannerRunning)
        return;

    try{

        await scanner.stop();

        scanner.clear();

    }catch(e){}

    scannerRunning=false;

}


/* -------------------------
   QR SCANNED
------------------------- */

async function qrSuccess(decodedText){

    await stopScanner();


    let data;


    try{

        if(!decodedText.startsWith("NWSC_PUMP:")){

            throw new Error(
                "This is not an NWSC pump QR code."
            );

        }


        const encoded=
            decodedText.substring(10);


        data=JSON.parse(

            decodeURIComponent(

                escape(
                    atob(encoded)
                )

            )

        );


    }catch(error){

        alert(
            "Invalid pump QR code."
        );

        return;

    }


    displayPump(data);

}

async function savePumpToGitHub(pumpData) {

    const token = prompt(
        "Enter your GitHub Personal Access Token:\n\n" +
        "This is required to save the pump record to GitHub."
    );

    if (!token) {
        throw new Error("GitHub token was not provided.");
    }

    // Get current pumps.json
    const getResponse = await fetch(
        `${GITHUB_API}?ref=${GITHUB_BRANCH}`,
        {
            headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`
            }
        }
    );

    if (!getResponse.ok) {
        throw new Error(
            "Unable to access pumps.json. Check your GitHub token."
        );
    }

    const fileData = await getResponse.json();

    // Decode GitHub's Base64 content
    const currentContent = decodeURIComponent(
        escape(
            atob(fileData.content.replace(/\n/g, ""))
        )
    );

    let pumps = [];

    try {
        pumps = JSON.parse(currentContent);
    } catch (error) {
        throw new Error("pumps.json contains invalid JSON.");
    }

    if (!Array.isArray(pumps)) {
        throw new Error("pumps.json must contain an array.");
    }

    // Prevent duplicate Record IDs
    const duplicate = pumps.some(
        pump => pump.recordId === pumpData.recordId
    );

    if (duplicate) {
        throw new Error(
            `Record ID ${pumpData.recordId} already exists.`
        );
    }

    // Add new pump
    pumps.push(pumpData);

    // Convert back to JSON
    const newContent = btoa(
        unescape(
            encodeURIComponent(
                JSON.stringify(pumps, null, 2)
            )
        )
    );

    // Write back to GitHub
    const updateResponse = await fetch(GITHUB_API, {
        method: "PUT",

        headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: `Add pump ${pumpData.recordId}`,
            content: newContent,
            sha: fileData.sha,
            branch: GITHUB_BRANCH
        })
    });

    if (!updateResponse.ok) {

        const errorData = await updateResponse.json();

        throw new Error(
            errorData.message ||
            "GitHub failed to save the pump record."
        );
    }

    return true;
}

/* -------------------------
   DISPLAY PUMP
------------------------- */

function displayPump(data){

    const fields=[

        ["Record ID",data.recordId],

        ["Entry Date",data.entryDate],

        ["NWSC Asset Number",data.assetNumber],

        ["Serial Number",data.serialNumber],

        ["Pump Manufacturer",data.pumpManufacturer],

        ["Pump Model",data.pumpModel],

        ["Pump Type",data.pumpType],

        ["Pump Capacity (m³/h)",data.pumpCapacity],

        ["Motor Rating (kW)",data.motorRating],

        ["Motor Serial Number",data.motorSerialNumber],

        ["Station",data.station],

        ["Location / Installation Point",data.location],

        ["Delivered By",data.deliveredBy],

        ["Date Received",data.dateReceived],

        ["Fault Reported",data.faultReported],

        ["Condition",data.condition]

    ];


    document.getElementById(
        "pump-details"
    ).innerHTML=

        fields.map(function(field){

            return `

            <div class="row">

                <strong>
                    ${escapeHTML(field[0])}
                </strong>

                <span>
                    ${escapeHTML(
                        field[1] || "—"
                    )}
                </span>

            </div>

            `;

        }).join("");


    document.getElementById(
        "scan-result"
    ).style.display="block";


    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}


/* -------------------------
   SCAN AGAIN
------------------------- */

async function scanAgain(){

    document.getElementById(
        "scan-result"
    ).style.display="none";

    await startScanner();

}


/* -------------------------
   RESET FORM
------------------------- */

function resetForm(){

    const ids=[

        "recordId",
        "assetNumber",
        "serialNumber",
        "pumpManufacturer",
        "pumpModel",
        "pumpCapacity",
        "motorRating",
        "motorSerialNumber",
        "station",
        "location",
        "deliveredBy",
        "faultReported"

    ];


    ids.forEach(function(id){

        document.getElementById(id).value="";

    });


    const today=
        new Date()
        .toISOString()
        .split("T")[0];


    document.getElementById(
        "entryDate"
    ).value=today;

    document.getElementById(
        "dateReceived"
    ).value=today;


    document.getElementById(
        "pumpType"
    ).value="Centrifugal";


    document.getElementById(
        "condition"
    ).value="In Service";


    document.getElementById(
        "qr-code"
    ).innerHTML="";


    document.getElementById(
        "qr-section"
    ).style.display="none";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* -------------------------
   SECURITY
------------------------- */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
