<script>

let scanner = null;
let scannerRunning = false;

/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "Luts-Inv";
const GITHUB_REPO = "NWSC-Workshop-Tracking-System";
const GITHUB_BRANCH = "main";
const PUMPS_FILE = "pumps.json";

const GITHUB_API =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PUMPS_FILE}`;

const GITHUB_RAW =
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${PUMPS_FILE}`;


/* =========================================================
   PAGE LOAD
========================================================= */

window.onload = function () {

    const today = new Date().toISOString().split("T")[0];

    document.getElementById("entryDate").value = today;
    document.getElementById("dateReceived").value = today;

};


/* =========================================================
   GENERATE UNIQUE RECORD ID
========================================================= */

function generateRecordId() {

    const station =
        (document.getElementById("station").value || "GEN")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .substring(0, 5) || "GEN";

    const timestamp = Date.now();

    return `NWSC-${station}-P-${timestamp}`;
}


/* =========================================================
   COLLECT FORM DATA
========================================================= */

function collectPumpData() {

    return {

        recordId:
            document.getElementById("recordId").value.trim(),

        entryDate:
            document.getElementById("entryDate").value,

        assetNumber:
            document.getElementById("assetNumber").value.trim(),

        serialNumber:
            document.getElementById("serialNumber").value.trim(),

        pumpManufacturer:
            document.getElementById("pumpManufacturer").value.trim(),

        pumpModel:
            document.getElementById("pumpModel").value.trim(),

        pumpType:
            document.getElementById("pumpType").value,

        pumpCapacity:
            document.getElementById("pumpCapacity").value,

        motorRating:
            document.getElementById("motorRating").value,

        motorSerialNumber:
            document.getElementById("motorSerialNumber").value.trim(),

        station:
            document.getElementById("station").value.trim(),

        location:
            document.getElementById("location").value.trim(),

        deliveredBy:
            document.getElementById("deliveredBy").value.trim(),

        dateReceived:
            document.getElementById("dateReceived").value,

        faultReported:
            document.getElementById("faultReported").value.trim(),

        condition:
            document.getElementById("condition").value
    };
}


/* =========================================================
   VALIDATE FORM
========================================================= */

function validate(data) {

    const required = [

        ["NWSC Asset Number", data.assetNumber],

        ["Serial Number", data.serialNumber],

        ["Pump Manufacturer", data.pumpManufacturer],

        ["Pump Model", data.pumpModel],

        ["Station", data.station]

    ];

    const missing =
        required
        .filter(item => !item[1])
        .map(item => item[0]);

    if (missing.length > 0) {

        alert(
            "Please complete the following fields:\n\n" +
            missing.join("\n")
        );

        return false;
    }

    return true;
}


/* =========================================================
   MAIN REGISTER FUNCTION
========================================================= */

async function generatePumpQR() {

    try {

        /* -----------------------------------------
           1. GENERATE UNIQUE RECORD ID
        ----------------------------------------- */

        const recordId = generateRecordId();

        document.getElementById("recordId").value = recordId;


        /* -----------------------------------------
           2. COLLECT FORM
        ----------------------------------------- */

        const data = collectPumpData();


        /* -----------------------------------------
           3. VALIDATE
        ----------------------------------------- */

        if (!validate(data)) {
            return;
        }


        /* -----------------------------------------
           4. CHECK QR LIBRARY
        ----------------------------------------- */

        if (typeof QRCode === "undefined") {

            alert(
                "QR generator library has not loaded.\n\n" +
                "Please check your internet connection and reload."
            );

            return;
        }


        /* -----------------------------------------
           5. SAVE TO GITHUB
        ----------------------------------------- */

        const saved = await savePumpToGithub(data);

        if (!saved) {
            return;
        }


        /* -----------------------------------------
           6. GENERATE QR
        ----------------------------------------- */

        createPumpQR(data);


    } catch (error) {

        console.error(error);

        alert(
            "SYSTEM ERROR:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   SAVE PUMP TO GITHUB
========================================================= */

async function savePumpToGithub(pumpData) {

    /*
       For now the GitHub token is requested from you.

       IMPORTANT:
       Do NOT permanently put your GitHub token inside
       this HTML file.
    */

    const token = prompt(
        "Enter your GitHub Personal Access Token:\n\n" +
        "The token is required to save this pump to pumps.json."
    );

    if (!token) {

        alert("GitHub token was not provided.");

        return false;
    }


    /* -----------------------------------------
       GET CURRENT pumps.json
    ----------------------------------------- */

    const getResponse = await fetch(
        `${GITHUB_API}?ref=${GITHUB_BRANCH}`,
        {
            method: "GET",

            headers: {

                "Accept":
                    "application/vnd.github+json",

                "Authorization":
                    `Bearer ${token}`,

                "X-GitHub-Api-Version":
                    "2022-11-28"
            }
        }
    );


    if (!getResponse.ok) {

        const errorText =
            await getResponse.text();

        throw new Error(
            "GitHub could not open pumps.json.\n\n" +
            errorText
        );
    }


    const fileData =
        await getResponse.json();


    /* -----------------------------------------
       DECODE FILE
    ----------------------------------------- */

    const decoded =
        atob(
            fileData.content.replace(/\n/g, "")
        );

    const currentContent =
        decodeURIComponent(
            escape(decoded)
        );


    /* -----------------------------------------
       READ JSON
    ----------------------------------------- */

    let pumps = [];

    try {

        pumps =
            JSON.parse(currentContent);

    } catch (error) {

        throw new Error(
            "Your pumps.json file contains invalid JSON."
        );
    }


    if (!Array.isArray(pumps)) {

        throw new Error(
            "pumps.json must contain an array like []"
        );
    }


    /* -----------------------------------------
       CHECK DUPLICATE RECORD ID
    ----------------------------------------- */

    const duplicate =
        pumps.some(
            pump =>
                pump.recordId === pumpData.recordId
        );


    if (duplicate) {

        throw new Error(
            "Duplicate Record ID detected:\n" +
            pumpData.recordId
        );
    }


    /* -----------------------------------------
       ADD NEW PUMP
    ----------------------------------------- */

    pumps.push(pumpData);


    /* -----------------------------------------
       CONVERT BACK TO JSON
    ----------------------------------------- */

    const newContent =
        btoa(
            unescape(
                encodeURIComponent(
                    JSON.stringify(
                        pumps,
                        null,
                        2
                    )
                )
            )
        );


    /* -----------------------------------------
       UPDATE GITHUB
    ----------------------------------------- */

    const updateResponse =
        await fetch(
            GITHUB_API,
            {
                method: "PUT",

                headers: {

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        `Bearer ${token}`,

                    "Content-Type":
                        "application/json",

                    "X-GitHub-Api-Version":
                        "2022-11-28"
                },

                body:
                    JSON.stringify({

                        message:
                            `Add pump ${pumpData.recordId}`,

                        content:
                            newContent,

                        sha:
                            fileData.sha,

                        branch:
                            GITHUB_BRANCH
                    })
            }
        );


    if (!updateResponse.ok) {

        const errorData =
            await updateResponse.json();

        throw new Error(
            errorData.message ||
            "GitHub failed to save the pump."
        );
    }


    return true;
}


/* =========================================================
   CREATE QR CODE
========================================================= */

function createPumpQR(data) {

    const qr =
        document.getElementById("qr-code");


    /* Clear previous QR */

    qr.innerHTML = "";


    /*
       IMPORTANT:

       The QR contains ALL pump information.

       Therefore the scanner does not need internet
       or GitHub to display the specifications.
    */

    const jsonData =
        JSON.stringify(data);


    const payload =
        "NWSC_PUMP:" +
        btoa(
            unescape(
                encodeURIComponent(jsonData)
            )
        );


    /* -----------------------------------------
       CREATE QR
    ----------------------------------------- */

    new QRCode(
        qr,
        {
            text: payload,

            width: 280,

            height: 280,

            colorDark: "#000000",

            colorLight: "#ffffff",

            correctLevel:
                QRCode.CorrectLevel.H
        }
    );


    /* -----------------------------------------
       SHOW RECORD ID
    ----------------------------------------- */

    document.getElementById(
        "qr-record-id"
    ).textContent =
        data.recordId;


    /* -----------------------------------------
       SHOW QR SECTION
    ----------------------------------------- */

    document.getElementById(
        "qr-section"
    ).style.display =
        "block";


    /* -----------------------------------------
       SCROLL TO QR
    ----------------------------------------- */

    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"
    });
}


/* =========================================================
   REGISTER TAB
========================================================= */

function showRegister() {

    stopScanner();


    document.getElementById(
        "registerSection"
    ).style.display =
        "block";


    document.getElementById(
        "scan-section"
    ).style.display =
        "none";


    document.getElementById(
        "registerTab"
    ).classList.add("active");


    document.getElementById(
        "scanTab"
    ).classList.remove("active");
}


/* =========================================================
   SCANNER TAB
========================================================= */

function showScanner() {

    document.getElementById(
        "registerSection"
    ).style.display =
        "none";


    document.getElementById(
        "scan-section"
    ).style.display =
        "block";


    document.getElementById(
        "registerTab"
    ).classList.remove("active");


    document.getElementById(
        "scanTab"
    ).classList.add("active");


    startScanner();
}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

    if (scannerRunning) {
        return;
    }


    document.getElementById(
        "scan-result"
    ).style.display =
        "none";


    if (typeof Html5Qrcode === "undefined") {

        alert(
            "QR scanner library failed to load."
        );

        return;
    }


    try {

        scanner =
            new Html5Qrcode("reader");


        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            onScanSuccess,

            function () {}
        );


        scannerRunning = true;


    } catch (error) {

        console.error(
            "SCANNER ERROR:",
            error
        );


        alert(
            "Camera could not start.\n\n" +
            "Please allow camera access."
        );
    }
}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

    if (!scanner ||
        !scannerRunning) {

        return;
    }


    try {

        await scanner.stop();

        scanner.clear();

    } catch (error) {

        console.warn(
            "Scanner stop:",
            error
        );
    }


    scannerRunning = false;
}


/* =========================================================
   QR SCAN SUCCESS
========================================================= */

async function onScanSuccess(decodedText) {

    await stopScanner();


    try {

        /* -----------------------------------------
           CHECK QR FORMAT
        ----------------------------------------- */

        if (
            !decodedText.startsWith(
                "NWSC_PUMP:"
            )
        ) {

            throw new Error(
                "This is not a valid NWSC Pump QR code."
            );
        }


        /* -----------------------------------------
           REMOVE PREFIX
        ----------------------------------------- */

        const encodedData =
            decodedText.substring(
                "NWSC_PUMP:".length
            );


        /* -----------------------------------------
           DECODE BASE64
        ----------------------------------------- */

        const jsonText =
            decodeURIComponent(
                escape(
                    atob(encodedData)
                )
            );


        /* -----------------------------------------
           CONVERT JSON
        ----------------------------------------- */

        const record =
            JSON.parse(jsonText);


        /* -----------------------------------------
           CHECK RECORD ID
        ----------------------------------------- */

        if (!record.recordId) {

            throw new Error(
                "QR code does not contain a Record ID."
            );
        }


        /* -----------------------------------------
           DISPLAY
        ----------------------------------------- */

        displayPump(record);


    } catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );


        alert(
            "Could not read pump information:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   DISPLAY PUMP INFORMATION
========================================================= */

function displayPump(data) {

    const fields = [

        [
            "Record ID",
            data.recordId
        ],

        [
            "Entry Date",
            data.entryDate
        ],

        [
            "NWSC Asset Number",
            data.assetNumber
        ],

        [
            "Serial Number",
            data.serialNumber
        ],

        [
            "Pump Manufacturer",
            data.pumpManufacturer
        ],

        [
            "Pump Model",
            data.pumpModel
        ],

        [
            "Pump Type",
            data.pumpType
        ],

        [
            "Pump Capacity (m³/h)",
            data.pumpCapacity
        ],

        [
            "Motor Rating (kW)",
            data.motorRating
        ],

        [
            "Motor Serial Number",
            data.motorSerialNumber
        ],

        [
            "Station",
            data.station
        ],

        [
            "Location / Installation Point",
            data.location
        ],

        [
            "Delivered By",
            data.deliveredBy
        ],

        [
            "Date Received",
            data.dateReceived
        ],

        [
            "Fault Reported",
            data.faultReported
        ],

        [
            "Condition",
            data.condition
        ]

    ];


    const container =
        document.getElementById(
            "pump-details"
        );


    container.innerHTML =


        fields.map(
            ([label, value]) => `

                <div class="row">

                    <strong>
                        ${escapeHTML(label)}
                    </strong>

                    <span>
                        ${escapeHTML(
                            String(
                                value || "—"
                            )
                        )}
                    </span>

                </div>

            `
        ).join("");


    document.getElementById(
        "scan-result"
    ).style.display =
        "block";


    document.getElementById(
        "scan-result"
    ).scrollIntoView({
        behavior: "smooth"
    });
}


/* =========================================================
   SCAN ANOTHER
========================================================= */

async function scanAgain() {

    document.getElementById(
        "scan-result"
    ).style.display =
        "none";


    await startScanner();
}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

    const ids = [

        "recordId",

        "assetNumber",

        "serialNumber",

        "pumpManufacturer",

        "pumpModel",

        "pumpCapacity",

        "motorRating",

        "motorSerialNumber",

        "station",

        "location",

        "deliveredBy",

        "faultReported"

    ];


    ids.forEach(
        id => {

            document.getElementById(
                id
            ).value = "";

        }
    );


    const today =
        new Date()
        .toISOString()
        .split("T")[0];


    document.getElementById(
        "entryDate"
    ).value = today;


    document.getElementById(
        "dateReceived"
    ).value = today;


    document.getElementById(
        "pumpType"
    ).value =
        "Centrifugal";


    document.getElementById(
        "condition"
    ).value =
        "In Service";


    document.getElementById(
        "qr-code"
    ).innerHTML =
        "";


    document.getElementById(
        "qr-section"
    ).style.display =
        "none";


    window.scrollTo({

        top: 0,

        behavior:
            "smooth"
    });
}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

</script>
